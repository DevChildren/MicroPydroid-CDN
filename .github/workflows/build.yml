name: Build ESP32 Android Toolchain

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download Pre-built ARM64 Toolchain
        run: |
          echo "Mengunduh toolchain aarch64 statis dari Espressif..."
          # Ganti tulisan di bawah dengan link URL .tar.xz yang Anda temukan
          wget -q -O toolchain.tar.xz "https://github.com/espressif/crosstool-NG/releases/download/esp-15.3.0_20260914/xtensa-esp-elf-15.3.0_20260914-arm-linux-gnueabi.tar.xz"
          
      - name: Repackage for MicroPyDroidIDE
        run: |
          echo "Mengekstrak fail..."
          tar -xf toolchain.tar.xz
          
          echo "Membungkus ulang ke format ZIP untuk Android..."
          mkdir -p esp32_pack
          
          # Menyalin dari folder xtensa-esp-elf (nama folder bawaan dari Espressif yang baru)
          cp -r xtensa-esp-elf/* esp32_pack/
          
          zip -q -r esp32_compiler_pack_android_native.zip esp32_pack/

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: esp32_compiler_pack_android_native.zip
          tag_name: v1.0-android

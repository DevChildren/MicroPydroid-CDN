name: Build ESP32-S3 Android Toolchain

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download Pre-built ARM64 Toolchain
        run: |
          echo "Mengunduh pre-built toolchain aarch64 resmi dari Espressif..."
          # Menggunakan rilis stabil Espressif untuk Linux ARM64 (aarch64)
          wget -q https://github.com/espressif/crosstool-NG/releases/download/esp-13.2.0_20230928/xtensa-esp32s3-elf-esp-13.2.0_20230928-aarch64-linux-gnu.tar.xz
          
      - name: Repackage for MicroPyDroidIDE
        run: |
          echo "Mengekstrak file..."
          tar -xf *.tar.xz
          
          echo "Membungkus ulang ke format ZIP..."
          mkdir -p esp32s3_pack
          # Memindahkan isi folder hasil ekstraksi ke folder pack kita
          cp -r xtensa-esp32s3-elf/* esp32s3_pack/
          
          zip -r esp32s3_compiler_pack_android_native.zip esp32s3_pack/

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: esp32s3_compiler_pack_android_native.zip
          tag_name: v1.0-android
